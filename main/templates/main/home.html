<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主頁</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 20vh; }
    button { font-size: 1.5rem; padding: .8rem 2rem; cursor: pointer; }
  </style>
</head>
<body>
  <p>你好，{{ user.get_username }}</p>
  <button type="button" id="start-unraid">啟動unraid</button>
  <pre id="result" style="text-align:left;display:inline-block;max-width:80vw;white-space:pre-wrap"></pre>
  <form method="post" action="{% url 'logout' %}" style="margin-top:2rem">
    {% csrf_token %}
    <button type="submit" style="font-size:1rem;padding:.3rem 1rem">登出</button>
  </form>
  <script>
    const btn = document.getElementById('start-unraid');
    const result = document.getElementById('result');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      result.textContent = '執行中…';
      try {
        const res = await fetch("{% url 'start_unraid' %}", {
          method: 'POST',
          headers: {'X-CSRFToken': '{{ csrf_token }}'},
        });
        const data = await res.json();
        result.textContent = (data.ok ? '成功\n' : '失敗\n') + (data.output || '');
      } catch (e) {
        result.textContent = '請求失敗：' + e;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
